name: CI

# Compilar y pasar los tests en los DOS sistemas que el README promete. Hasta
# ahora no habia CI ordinaria: la unica automatizacion eran los agentes, asi que
# un fallo de compilacion podia entrar en master sin que nada lo detectara.

# `develop` es la rama de integracion: es ahi donde llegan las PR y donde tiene
# que estar la red. `master` se deja tambien porque es donde acaba lo que se
# publica, y romperla sin enterarse seria peor.
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

# Un PR que recibe varios pushes seguidos no necesita terminar las ejecuciones
# viejas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Fijadas por SHA: un tag movil se puede reapuntar a otro commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # @alpha/protocol es una git dependency de un repo PRIVADO: npm clona
      # por https y el runner no tiene credenciales. El PAT (fine-grained,
      # contents:read sobre ALPHA-protocol) entra por insteadOf cubriendo las
      # tres formas de URL que npm puede pedir.
      - name: Acceso a ALPHA-protocol (git dependency privada)
        shell: bash
        run: |
          BASE="https://x-access-token:${{ secrets.PROTOCOL_READ_TOKEN }}@github.com/DigitalTPM/ALPHA-protocol"
          git config --global url."$BASE".insteadOf "https://github.com/DigitalTPM/ALPHA-protocol"
          git config --global --add url."$BASE".insteadOf "ssh://git@github.com/DigitalTPM/ALPHA-protocol"
          git config --global --add url."$BASE".insteadOf "git@github.com:DigitalTPM/ALPHA-protocol"

      - name: Instalar dependencias
        run: npm ci

      # lint + formato + tipos (con los tests incluidos) + tests de todos los
      # paquetes. Ninguno necesita micro, ffmpeg, whisper ni red: el audio es
      # sintetico y los servicios, dobles.
      - name: Comprobar
        run: npm run check

      # Informativo: no hay umbral que romper la build. Un umbral pide antes
      # decidir que numero es honesto para un proyecto con tanta E/S de sistema
      # como este, y un numero puesto a ojo solo ensena a saltarselo.
      - name: Cobertura
        run: npm run coverage
