<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes idle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes listening {
        0%, 100% { transform: rotateZ(-2deg); }
        50% { transform: rotateZ(2deg); }
      }
      @keyframes thinking {
        0%, 100% { transform: rotateZ(0deg); }
        25% { transform: rotateZ(-1deg); }
        75% { transform: rotateZ(1deg); }
      }
      @keyframes speaking {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.05); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotateZ(0deg) translateY(0); }
        50% { transform: rotateZ(5deg) translateY(-2px); }
      }

      .body { animation: idle 3s ease-in-out infinite; transform-origin: 100px 100px; }
      .body.listening { animation: listening 0.6s ease-in-out infinite; }
      .body.thinking { animation: thinking 2s ease-in-out infinite; }
      .body.speaking { animation: speaking 0.4s ease-in-out infinite; }

      .head { animation: idle 3s ease-in-out infinite 0.1s; transform-origin: 100px 60px; }
      .head.listening { animation: headTilt 0.8s ease-in-out infinite; }
      .head.thinking { animation: thinking 2s ease-in-out infinite 0.2s; }
      .head.speaking { animation: speaking 0.4s ease-in-out infinite; }

      .eyes { animation: idle 3s ease-in-out infinite 0.2s; }
      .eye-blink { animation: blink 4s ease-in-out infinite; }

      @keyframes blink {
        0%, 90%, 100% { scaleY(1); }
        95% { scaleY(0.1); }
      }
    </style>
  </defs>

  <!-- Cuerpo -->
  <g class="body">
    <!-- Torso (azul acero) -->
    <ellipse cx="100" cy="140" rx="45" ry="55" fill="#5f9bd2" stroke="#2d5aa0" stroke-width="2"/>
    <!-- Pecho iluminado -->
    <circle cx="100" cy="130" r="25" fill="#7ab0e8" opacity="0.6"/>
    <!-- Luz del pecho (círculo de energía) -->
    <circle cx="100" cy="130" r="12" fill="#5dd9ff" opacity="0.8"/>

    <!-- Brazos -->
    <g>
      <!-- Brazo izquierdo -->
      <ellipse cx="60" cy="120" rx="15" ry="40" fill="#5f9bd2" stroke="#2d5aa0" stroke-width="1.5" transform="rotate(-20 60 120)"/>
      <circle cx="50" cy="155" r="10" fill="#7ab0e8"/>

      <!-- Brazo derecho -->
      <ellipse cx="140" cy="120" rx="15" ry="40" fill="#5f9bd2" stroke="#2d5aa0" stroke-width="1.5" transform="rotate(20 140 120)"/>
      <circle cx="150" cy="155" r="10" fill="#7ab0e8"/>
    </g>

    <!-- Piernas -->
    <g>
      <rect x="85" y="180" width="12" height="50" rx="6" fill="#2d5aa0"/>
      <rect x="103" y="180" width="12" height="50" rx="6" fill="#2d5aa0"/>
      <circle cx="91" cy="235" r="8" fill="#1a3a5c"/>
      <circle cx="109" cy="235" r="8" fill="#1a3a5c"/>
    </g>
  </g>

  <!-- Cabeza -->
  <g class="head">
    <!-- Casco/cabeza (esfera) -->
    <circle cx="100" cy="60" r="35" fill="#7ab0e8" stroke="#2d5aa0" stroke-width="2"/>

    <!-- Cara frontal (más oscura) -->
    <ellipse cx="100" cy="70" rx="30" ry="25" fill="#5f9bd2" opacity="0.9"/>

    <!-- Ojos brillantes -->
    <g class="eyes">
      <!-- Ojo izquierdo -->
      <circle cx="85" cy="55" r="6" fill="#5dd9ff" stroke="#2d5aa0" stroke-width="1"/>
      <circle cx="85" cy="55" r="3" fill="#0099ff"/>
      <circle cx="87" cy="53" r="1.5" fill="white"/>

      <!-- Ojo derecho -->
      <circle cx="115" cy="55" r="6" fill="#5dd9ff" stroke="#2d5aa0" stroke-width="1"/>
      <circle cx="115" cy="55" r="3" fill="#0099ff"/>
      <circle cx="117" cy="53" r="1.5" fill="white"/>
    </g>

    <!-- Antena/sensor -->
    <line x1="100" y1="20" x2="100" y2="5" stroke="#2d5aa0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="3" r="2.5" fill="#5dd9ff"/>
  </g>

  <!-- Luz ambiental (glow detrás) -->
  <circle cx="100" cy="140" r="55" fill="none" stroke="#5dd9ff" stroke-width="1.5" opacity="0.3"/>
</svg>
