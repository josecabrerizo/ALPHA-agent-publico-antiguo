# Configuracion por defecto de A.L.P.H.A.
# Para ajustes locales sin tocar git: copiar a config/local.yaml (ignorado).

# Modo confidencial: desactiva TODA salida a la nube durante la sesion.
# La "H" de Hibrido es opcional por diseno; esto es el interruptor.
confidencial: false

audio:
  # Nombre exacto del dispositivo. Vacio = el primero del sistema.
  # Listar con: npm run devices
  dispositivo: ''
  vad:
    hangoverMs: 700       # silencio que cierra un tramo hablado
    minUtteranceMs: 300   # por debajo, es un chasquido y se descarta
    preRollMs: 300        # audio previo conservado, para no comerse la primera silaba
    thresholdFactor: 3.0  # cuanto debe superar el ruido de fondo para contar como voz

stt:
  motor: whisper.cpp
  modelo: small           # base | small | medium — small es el minimo decente en espanol
  idioma: es              # 'auto' para detectar

# Cerebro. Patron Hermes/OpenClaw: registro de proveedores compatibles con la
# API de OpenAI + una referencia por defecto en formato proveedor/modelo.
# UN solo cliente sirve para todos; solo cambian base_url, clave y modelo.
# (De momento el codigo usa DEFAULT_BRAIN_CONFIG en brain/config.ts; este
#  bloque documenta la forma para cuando exista el cargador de YAML.)
cerebro:
  modelo: ollama/gemma4:12b   # el unico modelo presente en la maquina
  # Razonamiento: 'none' con modelos "thinking" (gemma4) para no perder
  # segundos ni tokens razonando antes de responder. Clave para la voz.
  razonamiento: none          # none | low | medium | high
  proveedores:
    ollama:
      base_url: http://127.0.0.1:11434/v1
      api_key: ollama         # Ollama la ignora, pero el cliente la exige
      local: true             # disponible en modo confidencial
      modelos: [gemma4:12b]
    anthropic:
      base_url: https://api.anthropic.com/v1
      api_key_env: ANTHROPIC_API_KEY   # nunca el secreto en el fichero
      local: false
      modelos: [claude-sonnet-5, claude-opus-4-8]
    openai:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      local: false
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY
      local: false

tts:
  motor: msedge-tts       # requiere red; en modo confidencial se cae a piper
  voz: es-ES-AlvaroNeural
  local:
    motor: piper
    voz: es_ES-sharvard-medium

# Cuatro agentes seleccionables; el avatar es un recurso, no codigo.
# Ver packages/ui-avatar cuando exista.
agente: vulpis            # vulpis | unit-a | nexus | synapse
