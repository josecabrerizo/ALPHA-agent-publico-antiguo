# Configuracion por defecto de A.L.P.H.A.
#
# Este fichero SI se consume: el cargador central (engine/config/loader.ts) lo
# fusiona sobre los defaults del esquema, luego config/local.yaml, y por ultimo
# los ajustes en vivo del avatar (config/alpha.settings.json). Las claves casan
# con el esquema (engine/config/schema.ts): editar aqui tiene efecto.
#
# Para ajustes locales sin tocar git: copiar a config/local.yaml (ignorado).

version: 1

# Modo confidencial: nada de nube durante la sesion. Es la fuente de verdad; se
# propaga al cerebro y a la voz. La "H" de Hibrido es opcional por diseno.
confidential: false

# Agente activo (identidad del avatar): vulpis | unit-a | nexus | synapse.
agent: unit-a

audio:
  device: ''        # nombre exacto del microfono; vacio = el del sistema
  gainDb: 0         # ganancia fija en dB (micros lejanos flojos)
  normalize: false  # normalizacion dinamica (dynaudnorm)
  # false = ni se abre la captura (el indicador de micro del sistema, apagado).
  # Lo escribe el interruptor del avatar y se conserva entre arranques.
  micEnabled: true

stt:
  model: small      # base | small | medium (small es el minimo decente en espanol)
  language: es      # 'auto' para detectar

conversation:
  # Cortar a A.L.P.H.A. hablandole mientras responde. La interrupcion la decide
  # la TRANSCRIPCION (que haya palabras), no el VAD (que salta con cualquier
  # ruido), y se descarta si lo oido es su propia voz por el altavoz.
  bargeIn: true
  bargeInMinMs: 600  # habla minima para molestarse en transcribir

# Cerebro. Patron Hermes/OpenClaw: registro de proveedores compatibles con la
# API de OpenAI + referencia por defecto en formato proveedor/modelo. Un solo
# cliente sirve para todos; solo cambian baseUrl, clave y modelo.
brain:
  model: ollama/gemma4:12b   # el modelo local presente en la maquina
  providers:
    ollama:
      baseUrl: http://127.0.0.1:11434/v1
      apiKey: ollama         # Ollama la ignora, pero el cliente la exige
      local: true
      models: [gemma4:12b, ornith:9b, gemma4:31b-cloud]
      # gemma4:31b-cloud corre en la nube de Ollama (los datos salen) pese a
      # acceder por el endpoint local: el confidencial lo bloquea (resolveModel).
      cloudModels: [gemma4:31b-cloud]
    anthropic:
      baseUrl: https://api.anthropic.com/v1
      apiKeyEnv: ANTHROPIC_API_KEY   # nunca el secreto en el fichero
      local: false
      models: [claude-sonnet-5, claude-opus-4-8]
    openai:
      baseUrl: https://api.openai.com/v1
      apiKeyEnv: OPENAI_API_KEY
      local: false
    gemini:
      baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
      apiKeyEnv: GEMINI_API_KEY
      local: false

tts:
  engine: edge                     # edge (neuronal, online) | sapi (local Windows)
  edgeVoice: es-ES-AlvaroNeural
  # Local es SAPI (voces de Windows), no Piper: Piper saca sus voces de
  # HuggingFace, bloqueado en esta red. En modo confidencial se usa este.
  sapiVoice: Microsoft Helena Desktop
  # Voz elegida a mano en el menu del avatar ("sapi:Nombre" | "edge:es-ES-...").
  # Manda sobre la del perfil del avatar. Vacio = la que traiga el perfil.
  voiceId: ''
